name: iOS Unsigned IPA for Sideloadly

# Unsignierte iOS-IPA für persönliches Sideloading (z. B. Sideloadly).
# Kein Apple Developer Account, kein Codesigning, kein App Store / TestFlight.
# Android bleibt lokal unter Windows.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"
  APP_BUILD_NAME: "1.0.0"
  APP_BUILD_NUMBER: "1"

jobs:
  build_ios_unsigned:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require DOTENV_FILE and write .env
        env:
          DOTENV_FILE: ${{ secrets.DOTENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${DOTENV_FILE}" ]; then
            echo "::error::Missing required GitHub Secret: DOTENV_FILE"
            echo "::error::The app bundles .env as an asset and cannot build without it."
            exit 1
          fi
          # Inhalt niemals loggen
          printf '%s\n' "$DOTENV_FILE" > .env
          echo ".env written from DOTENV_FILE (contents not logged)."

      - name: Report Bundle ID (sideload warning only)
        run: |
          set -euo pipefail
          FOUND="$(grep -E 'PRODUCT_BUNDLE_IDENTIFIER = ' ios/Runner.xcodeproj/project.pbxproj \
            | grep -v RunnerTests \
            | head -n 1 \
            | sed -E 's/.*= ([^;]+);/\1/' \
            | tr -d ' ')"
          echo "Xcode PRODUCT_BUNDLE_IDENTIFIER: ${FOUND}"
          case "$FOUND" in
            com.example.*)
              echo "::warning::Placeholder Bundle ID detected: ${FOUND}"
              ;;
          esac
          echo "Warning: This IPA is intended only for personal sideloading and is not App Store ready."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          echo "Flutter:"
          flutter --version
          echo "Dart:"
          dart --version
          echo "Xcode:"
          xcodebuild -version
          echo "CocoaPods:"
          pod --version

      - name: Flutter clean and pub get
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Verify Podfile and install CocoaPods
        run: |
          set -euo pipefail
          if [ ! -f ios/Podfile ]; then
            echo "::error::ios/Podfile is missing."
            exit 1
          fi
          if [ ! -f ios/Runner.xcworkspace/contents.xcworkspacedata ]; then
            echo "::error::ios/Runner.xcworkspace is missing."
            exit 1
          fi
          cd ios
          pod install --repo-update
          cd ..

      - name: Analyze and test
        run: |
          set -euo pipefail
          flutter analyze
          flutter test

      - name: Build iOS without codesigning
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=${{ env.APP_BUILD_NAME }} \
            --build-number=${{ env.APP_BUILD_NUMBER }}

          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "::error::Runner.app not found at build/ios/iphoneos/Runner.app"
            exit 1
          fi
          echo "Runner.app present."

      - name: Package unsigned IPA for Sideloadly
        run: |
          set -euo pipefail
          rm -rf build/ios/sideload
          mkdir -p build/ios/sideload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/sideload/Payload/
          (
            cd build/ios/sideload
            zip -r Memory-AI-1.0.0-unsigned.ipa Payload
          )

          IPA="build/ios/sideload/Memory-AI-1.0.0-unsigned.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::error::Unsigned IPA missing: $IPA"
            exit 1
          fi

          echo "IPA listing:"
          unzip -l "$IPA"

          if ! unzip -l "$IPA" | grep -q 'Payload/Runner.app/'; then
            echo "::error::IPA does not contain Payload/Runner.app/"
            exit 1
          fi

          ls -lh "$IPA"
          echo "Warning: This IPA is intended only for personal sideloading and is not App Store ready."

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-ai-1.0.0-unsigned-ipa-sideloadly
          path: build/ios/sideload/Memory-AI-1.0.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary files
        if: always()
        run: |
          set +e
          rm -f .env
