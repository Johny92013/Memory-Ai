name: Release Builds

# Manuell oder per Git-Tag v* → APK, AAB, IPA als Artefakte (kein Store-Upload).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"
  APP_BUILD_NAME: "1.0.0"
  APP_BUILD_NUMBER: "1"

jobs:
  build_android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Android + env secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DOTENV_FILE: ${{ secrets.DOTENV_FILE }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD DOTENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Android release cannot use debug.keystore. Add the secrets listed above."
            exit 1
          fi

      - name: Write .env (not logged)
        env:
          DOTENV_FILE: ${{ secrets.DOTENV_FILE }}
        run: printf '%s\n' "$DOTENV_FILE" > .env

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch video_thumbnail Android (jcenter/compileSdk)
        run: |
          set -euo pipefail
          GRADLE="$HOME/.pub-cache/hosted/pub.dev/video_thumbnail-0.5.6/android/build.gradle"
          if [ ! -f "$GRADLE" ]; then
            echo "video_thumbnail build.gradle not found – skip patch"
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          path = Path.home() / ".pub-cache/hosted/pub.dev/video_thumbnail-0.5.6/android/build.gradle"
          text = path.read_text(encoding="utf-8")
          text = text.replace("jcenter()", "mavenCentral()")
          text = text.replace("compileSdkVersion 33", "compileSdkVersion 36")
          text = text.replace(
              "classpath 'com.android.tools.build:gradle:4.1.0'",
              "classpath 'com.android.tools.build:gradle:8.7.3'",
          )
          path.write_bytes(text.encode("utf-8"))
          print("Patched video_thumbnail Android build.gradle")
          PY

      - name: Prepare Android release signing (temporary)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ env.APP_BUILD_NAME }} \
            --build-number=${{ env.APP_BUILD_NUMBER }}

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ env.APP_BUILD_NAME }} \
            --build-number=${{ env.APP_BUILD_NUMBER }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoryai-1.0.0-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoryai-1.0.0-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Android signing files
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties .env

  build_ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require iOS + env secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          DOTENV_FILE: ${{ secrets.DOTENV_FILE }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_KEYCHAIN_PASSWORD IOS_TEAM_ID IOS_BUNDLE_ID DOTENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Write .env (not logged)
        env:
          DOTENV_FILE: ${{ secrets.DOTENV_FILE }}
        run: printf '%s\n' "$DOTENV_FILE" > .env

      - name: Verify project Bundle ID matches secret
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          FOUND="$(grep -E 'PRODUCT_BUNDLE_IDENTIFIER = ' ios/Runner.xcodeproj/project.pbxproj | grep -v RunnerTests | head -n 1 | sed -E 's/.*= ([^;]+);/\1/' | tr -d ' ')"
          echo "Project bundle id: $FOUND"
          if [ "$FOUND" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::IOS_BUNDLE_ID secret does not match project PRODUCT_BUNDLE_IDENTIFIER ($FOUND)."
            echo "::error::Update the Xcode project and the App ID / provisioning profile to the same identifier."
            exit 1
          fi
          case "$FOUND" in
            com.example.*)
              echo "::warning::Placeholder Bundle ID detected ($FOUND). App Store distribution requires a unique ID you own."
              ;;
          esac

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install
        working-directory: ios
        run: pod install --repo-update

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Import Apple certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          /usr/libexec/PlistBuddy -c "Set :teamID ${IOS_TEAM_ID}" ios/ExportOptions.plist

          # Temporary team for this runner only (file cleaned by checkout next run)
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Manual\n' "$IOS_TEAM_ID" >> ios/Flutter/Release.xcconfig

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          set -euo pipefail
          # `flutter build ipa` is release-only; there is no --release flag for this target.
          flutter build ipa \
            --build-name=${{ env.APP_BUILD_NAME }} \
            --build-number=${{ env.APP_BUILD_NUMBER }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoryai-1.0.0-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup iOS signing material
        if: always()
        run: |
          set +e
          security delete-keychain "${KEYCHAIN_PATH:-}" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" .env
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
