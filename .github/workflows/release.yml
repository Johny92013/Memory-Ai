name: iOS IPA Release

# Nur iOS-IPA über GitHub Actions (kein Android).
# Manuell oder per Tag v* starten. Kein TestFlight-/App-Store-Upload.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Projekt verwendet Flutter 3.44.1 (lokal / vorherige Workflows); kein FVM.
  FLUTTER_VERSION: "3.44.1"
  APP_BUILD_NAME: "1.0.0"
  APP_BUILD_NUMBER: "1"

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require GitHub Secrets
        env:
          DOTENV_FILE: ${{ secrets.DOTENV_FILE }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in DOTENV_FILE IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_KEYCHAIN_PASSWORD IOS_TEAM_ID IOS_BUNDLE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Write .env from secret (not logged)
        env:
          DOTENV_FILE: ${{ secrets.DOTENV_FILE }}
        run: printf '%s\n' "$DOTENV_FILE" > .env

      - name: Reject placeholder Bundle ID and verify IOS_BUNDLE_ID
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          FOUND="$(grep -E 'PRODUCT_BUNDLE_IDENTIFIER = ' ios/Runner.xcodeproj/project.pbxproj \
            | grep -v RunnerTests \
            | head -n 1 \
            | sed -E 's/.*= ([^;]+);/\1/' \
            | tr -d ' ')"
          echo "Xcode PRODUCT_BUNDLE_IDENTIFIER: ${FOUND}"
          echo "Secret IOS_BUNDLE_ID: ${IOS_BUNDLE_ID}"

          if [ "$FOUND" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::Bundle ID mismatch."
            echo "::error::Xcode project has: ${FOUND}"
            echo "::error::IOS_BUNDLE_ID secret has: ${IOS_BUNDLE_ID}"
            echo "::error::They must match exactly (and match the provisioning profile)."
            exit 1
          fi

          case "$FOUND" in
            com.example.*)
              echo "::error::Placeholder Bundle ID detected: ${FOUND}"
              echo "::error::This workflow will not build a production IPA with a com.example.* identifier."
              echo "::error::Register a unique Bundle ID (e.g. app.memoryai.family), update ios/Runner.xcodeproj,"
              echo "::error::create a matching App ID + provisioning profile, then set IOS_BUNDLE_ID to that value."
              exit 1
              ;;
          esac

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          echo "Flutter:"
          flutter --version
          echo "Xcode:"
          xcodebuild -version
          echo "CocoaPods:"
          pod --version

      - name: Flutter clean and pub get
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Verify Podfile and install CocoaPods
        run: |
          set -euo pipefail
          if [ ! -f ios/Podfile ]; then
            echo "::error::ios/Podfile is missing."
            exit 1
          fi
          cd ios
          pod install --repo-update
          cd ..

      - name: Analyze and test
        run: |
          set -euo pipefail
          flutter analyze
          flutter test

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          # ExportOptions zur Laufzeit (App Store Connect / TestFlight Export, kein Upload)
          cat > ios/ExportOptions.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store-connect</string>
  <key>signingStyle</key>
  <string>manual</string>
  <key>teamID</key>
  <string>${IOS_TEAM_ID}</string>
  <key>compileBitcode</key>
  <false/>
  <key>stripSwiftSymbols</key>
  <true/>
  <key>uploadSymbols</key>
  <true/>
  <key>manageAppVersionAndBuildNumber</key>
  <false/>
  <key>provisioningProfiles</key>
  <dict>
    <key>${IOS_BUNDLE_ID}</key>
    <string>${PROFILE_NAME}</string>
  </dict>
</dict>
</plist>
EOF

          # Temporary team for this runner
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Manual\n' "$IOS_TEAM_ID" >> ios/Flutter/Release.xcconfig

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Installed provisioning profile UUID (not secret material)."

      - name: Build IPA
        run: |
          set -euo pipefail
          # `flutter build ipa` is always a release build; there is no --release flag for this target.
          flutter build ipa \
            --build-name=${{ env.APP_BUILD_NAME }} \
            --build-number=${{ env.APP_BUILD_NUMBER }} \
            --export-options-plist=ios/ExportOptions.plist

          shopt -s nullglob
          IPAS=(build/ios/ipa/*.ipa)
          if [ ${#IPAS[@]} -eq 0 ]; then
            echo "::error::No IPA found under build/ios/ipa/*.ipa"
            exit 1
          fi
          ls -lh "${IPAS[@]}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-ai-1.0.0-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary signing files
        if: always()
        run: |
          set +e
          security delete-keychain "${KEYCHAIN_PATH:-}" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/certificate.p12" \
                "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/profile.plist" \
                .env
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
