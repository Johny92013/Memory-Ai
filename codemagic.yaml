# Codemagic – iOS IPA 1.0.0
# Nach Verbinden des Repos in Codemagic Secrets setzen (siehe docs/IOS_IPA_BUILD.md).

workflows:
  ios-ipa-unsigned-sideloadly:
    name: iOS IPA unsigned (Sideloadly)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
      vars:
        APP_VERSION: "1.0.0"
        BUILD_NUMBER: "1"
      # Secret DOTENV_FILE = kompletter .env-Inhalt
    scripts:
      - name: Write .env
        script: |
          set -euo pipefail
          if [ -z "${DOTENV_FILE:-}" ]; then
            echo "Secret DOTENV_FILE fehlt"
            exit 1
          fi
          printf '%s\n' "$DOTENV_FILE" > .env
      - name: Get Flutter packages
        script: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build unsigned iOS
        script: |
          flutter build ios --release --no-codesign \
            --build-name=$APP_VERSION --build-number=$BUILD_NUMBER
      - name: Package IPA
        script: |
          set -euo pipefail
          APP_PATH="$(find build/ios/iphoneos -name '*.app' -maxdepth 1 | head -n 1)"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p release/1.0.0
          zip -r "release/1.0.0/MemoryAI-${APP_VERSION}+${BUILD_NUMBER}-unsigned.ipa" Payload
    artifacts:
      - release/1.0.0/*.ipa

  ios-ipa-signed:
    name: iOS IPA signed
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MemoryAI
    environment:
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
      ios_signing:
        bundle_identifier: com.johny92013.memoryai
        provisioning_profiles:
          - name: MemoryAI Development
        certificates:
          - name: MemoryAI Distribution
      vars:
        APP_VERSION: "1.0.0"
        BUILD_NUMBER: "1"
    scripts:
      - name: Write .env
        script: |
          set -euo pipefail
          printf '%s\n' "$DOTENV_FILE" > .env
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Build signed IPA
        script: |
          flutter build ipa \
            --build-name=$APP_VERSION --build-number=$BUILD_NUMBER \
            --export-options-plist=ios/ExportOptions-development.plist
          mkdir -p release/1.0.0
          cp build/ios/ipa/*.ipa "release/1.0.0/MemoryAI-${APP_VERSION}+${BUILD_NUMBER}-signed.ipa"
    artifacts:
      - release/1.0.0/*.ipa
      - build/ios/ipa/*.ipa
